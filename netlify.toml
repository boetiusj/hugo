[build]
publish = "public"
command = "hugo --gc --minify -b $URL"

[context.production.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

# Force non-www (or flip these if you prefer www)
[[redirects]]
  from = "https://www.crestwoodpainting.com/*"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true

[context.split1.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.147.3"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.147.3"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

[[redirects]]
from = "/npmjs/*"
to = "/npmjs/"
status = 200


[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/painter-in-prairie-village"
  to = "/painter-prairie-village"
  status = 301

[[redirects]]
from = "/12-questions"
to = "/12-questions-ask-painter"
status = 301  

[[redirects]]
from = "/colors-relaxation"
to = "/colors-interior"
status = 301

[[redirects]]
from = "/exterior-paint-important/"
to = "/exterior-color-tips"
status = 301
