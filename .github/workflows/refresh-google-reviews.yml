name: Refresh Google Reviews

on:
  schedule: [{ cron: "17 5 * * *" }]   # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # If your Hugo site is in a subfolder, change this (e.g. "site")
      SITE_DIR: "."
      # Keep these secret names as-is in GitHub → Settings → Secrets and variables → Actions
      PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}      # ← uses your repo secret
      API_KEY:  ${{ secrets.GOOGLE_API_KEY }}       # ← uses your repo secret
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check secrets present (safe)
        run: |
          # CHANGED: check the actual env vars we set above
          if [ -z "$PLACE_ID" ]; then
            echo "::error ::GOOGLE_PLACE_ID missing (set repo secret GOOGLE_PLACE_ID)"
            exit 1
          fi
          if [ -z "$API_KEY" ]; then
            echo "::error ::GOOGLE_API_KEY missing (set repo secret GOOGLE_API_KEY)"
            exit 1
          fi
          if [ -n "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "Build hook set"
          else
            echo "Build hook not set (optional)"
          fi
          # Tip: PLACE_ID must be the raw 'ChIJ…' string (no 'places/' prefix).

      - name: Fetch rating + count (Places API v1)
        run: |
          set -e
          mkdir -p "$SITE_DIR/data"

          # CHANGED: ensure PLACE_ID has no 'places/' prefix to avoid double segment
          PID="$PLACE_ID"
          PID="${PID#places/}"

          RESP=$(curl -s \
            -H "X-Goog-Api-Key: ${API_KEY}" \
            -H "X-Goog-FieldMask: rating,userRatingCount" \
            "https://places.googleapis.com/v1/places/${PID}")

          echo "Raw status snippet:"
          echo "$RESP" | jq '{rating, userRatingCount, error: .error, name}'

          # Fail on error block
          ERR=$(echo "$RESP" | jq -r '.error.message // empty')
          if [ -n "$ERR" ]; then
            echo "::error ::Places API error: $ERR"
            exit 1
          fi

          RATING=$(echo "$RESP" | jq -r '.rating // empty')
          COUNT=$(echo "$RESP" | jq -r '.userRatingCount // empty')
          if [ -z "$RATING" ] || [ -z "$COUNT" ]; then
            echo "::error ::Missing rating/userRatingCount in response."
            exit 1
          fi

          # Writes exactly where your Hugo template reads from:
          jq -n --arg pid "$PID" --argjson r "$RATING" --argjson c "$COUNT" \
            '{ rating: $r, reviews: $c, place_id: $pid }' \
            > "$SITE_DIR/data/googleReviews.json"

          echo "Wrote:"
          cat "$SITE_DIR/data/googleReviews.json"

      - name: Commit & push only if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add "$SITE_DIR/data/googleReviews.json"
          git diff --cached --quiet || git commit -m "chore: refresh Google review badge"
          git push

      - name: Trigger Netlify build (optional)
        if: ${{ env.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL"
