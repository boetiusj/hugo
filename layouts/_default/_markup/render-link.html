{{- $dest := .Destination | safeURL -}}
{{- $base := site.BaseURL | strings.TrimRight "/" -}}
{{- $warnAbsSameDomain := strings.HasPrefix $dest $base -}}
{{- if $warnAbsSameDomain }}
  {{ warnf "Hard-coded internal link in %s: %s" .Page.File.Path $dest }}
{{- end }}
<a href="{{ $dest }}"{{ with .Title }} title="{{ . | safeHTMLAttr }}"{{ end }}>{{ .Text | safeHTML }}</a>
