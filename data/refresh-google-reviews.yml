name: Refresh Google Reviews

on:
  workflow_dispatch:
    inputs:
      place_id:
        description: "Google Place ID"
        required: false
      output_path:
        description: "Path to write JSON"
        default: "data/reviews/google.json"
        required: false
      min_count:
        description: "Minimum review count"
        default: "0"
        required: false
  schedule:
    - cron: "23 9 * * *"  # 09:23 UTC = 04:23 CT (adjust)

permissions:
  contents: write   # <-- needed for commit/push on schedule

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Prefer dispatch inputs; fall back to repo Variables; then hard defaults
      PLACE_ID: ${{ inputs.place_id || vars.GOOGLE_PLACE_ID || '' }}
      OUTPUT_PATH: ${{ inputs.output_path || vars.REVIEWS_JSON_PATH || 'data/reviews/google.json' }}
      MIN_COUNT: ${{ inputs.min_count || vars.REVIEWS_MIN_COUNT || '0' }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity (no secrets)
        run: |
          echo "event: ${{ github.event_name }}"
          echo "PLACE_ID set? $([ -n \"$PLACE_ID\" ] && echo yes || echo NO)"
          echo "OUTPUT_PATH=$OUTPUT_PATH"
          echo "MIN_COUNT=$MIN_COUNT"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci
        # or: npm i --omit=dev

      - name: Fetch reviews & write file
        run: node scripts/refresh-reviews.js "$PLACE_ID" "$OUTPUT_PATH" "$MIN_COUNT"

      - name: Commit changes (if any)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git diff --cached --quiet && echo "No changes" || git commit -m "chore(reviews): auto-refresh"
          git push

      - name: Trigger Netlify build (optional)
        if: ${{ env.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl -X POST -fsSL "$NETLIFY_BUILD_HOOK_URL"
