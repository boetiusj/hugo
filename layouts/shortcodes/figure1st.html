<figure class="figure1st">
  {{/* register the first figure1st image on this page for preload */}}
  {{ if not (.Page.Scratch.Get "heroSrc") }}
    {{ .Page.Scratch.Set "heroSrc" (.Get "src") }}
  {{ end }}

  {{ partial "template-image.html" (dict
      "Destination" (.Get "src")
      "alt"        (.Get "alt")
      "eager"      true
      "class"      "responsive-image") }}
</figure>
