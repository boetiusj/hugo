###############################################
# Crestwood Painting — Netlify configuration  #
# Goal: one-hop normalization, zero 5xx, fast #
###############################################

# =========================
# BUILD & ENVIRONMENT
# =========================
[build]
publish = "public"
command = "hugo --gc --minify -b $URL"

[context.production.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.147.3"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.147.3"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

# =========================
# HEADERS (CACHING)
# =========================
# so XML isn’t sticky-cached
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted static assets: cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# HTML: revalidate at edge on each request (optional: add stale-while-revalidate later)
[[headers]]
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# =========================
# CANONICAL DOMAIN & PROTOCOL
# =========================
# 1) http://www → https://apex  (ONE hop)
[[redirects]]
  from = "http://www.crestwoodpainting.com/*"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true

# 2) https://www → https://apex  (ONE hop)
[[redirects]]
  from = "/:splat"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["www.crestwoodpainting.com"] }

# 3) http://apex → https://apex  (ONE hop)
[[redirects]]
  from = "http://crestwoodpainting.com/*"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true

# =========================
# INDEX NORMALIZATION
# =========================
# www root/subdir index.html → apex trailing slash (ONE hop)
[[redirects]]
  from = "/index.html"
  to   = "https://crestwoodpainting.com/"
  status = 301
  force = true
  conditions = { Host = ["www.crestwoodpainting.com"] }

[[redirects]]
  from = "/*/index.html"
  to   = "https://crestwoodpainting.com/:splat/"
  status = 301
  force = true
  conditions = { Host = ["www.crestwoodpainting.com"] }

# Apex root/subdir index.html → trailing slash
[[redirects]]
  from = "/index.html"
  to   = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*/index.html"
  to   = "/:splat/"
  status = 301
  force = true

# =========================
# PROTECT STATIC PAGES (avoid accidental proxy rewrites)
# Trailing-slash 301 + identity 200 rewrites for known slugs
# =========================

# /nail-pops
[[redirects]]
  from = "/nail-pops"
  to   = "/nail-pops/"
  status = 301
  force = true
[[redirects]]
  from = "/nail-pops/*"
  to   = "/nail-pops/:splat"
  status = 200
  force = true

# /painter-lees-summit
[[redirects]]
  from = "/painter-lees-summit"
  to   = "/painter-lees-summit/"
  status = 301
  force = true
[[redirects]]
  from = "/painter-lees-summit/*"
  to   = "/painter-lees-summit/:splat"
  status = 200
  force = true

# /daunting-colors
[[redirects]]
  from = "/daunting-colors"
  to   = "/daunting-colors/"
  status = 301
  force = true

[[redirects]]
  from = "/daunting-colors/*"
  to   = "/daunting-colors/:splat"
  status = 200
  force = true

# /awo-thanks — enforce trailing slash + serve from static
[[redirects]]
  from = "/awo-thanks"
  to   = "/awo-thanks/"
  status = 301
  force = true
[[redirects]]
  from = "/awo-thanks/*"
  to   = "/awo-thanks/:splat"
  status = 200
  force = true

# /awo-thanks — enforce trailing slash + serve from static
[[redirects]]
  from = "/*/amp"
  to   = "/:splat/"
  status = 301
  force = true
[[redirects]]
  from = "/*/amp/"
  to   = "/:splat/"
  status = 301
  force = true

