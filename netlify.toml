###############################################
# Crestwood Painting — Netlify configuration  #
# Goal: one-hop normalization, zero 5xx, fast #
###############################################

# =========================
# BUILD & ENVIRONMENT - 
# =========================
[build]
publish = "public"
command = "hugo --gc --minify -b $URL"

[context.production.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.147.3"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.147.3"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

# =========================
# HEADERS (CACHING)
# =========================
# so XML isn’t sticky-cached
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

# Fingerprinted static assets: cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# HTML: revalidate at edge on each request (optional: add stale-while-revalidate later)
[[headers]]
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

