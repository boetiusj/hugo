# www root index.html -> apex slash (ONE hop)
[[redirects]]
  from = "/index.html"
  to   = "https://crestwoodpainting.com/"
  status = 301
  force = true
  conditions = { Host = ["www.crestwoodpainting.com"] }

# www subdir index.html -> apex slash (ONE hop)
[[redirects]]
  from = "/*/index.html"
  to   = "https://crestwoodpainting.com/:splat/"
  status = 301
  force = true
  conditions = { Host = ["www.crestwoodpainting.com"] }

# ---------- ONE-HOP NORMALIZATION (specific first) ----------

# http://www  →  https://apex  (ONE hop)
[[redirects]]
  from = "http://www.crestwoodpainting.com/*"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true

# https://www  →  https://apex  (ONE hop)
[[redirects]]
  from = "/:splat"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true
  conditions = { Host = ["www.crestwoodpainting.com"] }

# http://apex  →  https://apex  (ONE hop)
[[redirects]]
  from = "http://crestwoodpainting.com/*"
  to   = "https://crestwoodpainting.com/:splat"
  status = 301
  force = true

# Root /index.html  →  /   (normalize)
[[redirects]]
  from = "/index.html"
  to   = "/"
  status = 301
  force = true

# Subdir */index.html  →  */  (normalize)
[[redirects]]
  from = "/*/index.html"
  to   = "/:splat/"
  status = 301
  force = true

# Add caching headers (safe, low-risk)
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
  Cache-Control = "public, max-age=0, must-revalidate"

[build]
publish = "public"
command = "hugo --gc --minify -b $URL"

[context.production.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_VERSION = "0.147.3"
HUGO_ENV = "production"

[context.deploy-preview]
command = "hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
HUGO_VERSION = "0.147.3"

[context.branch-deploy]
command = "hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
HUGO_VERSION = "0.147.3"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"

