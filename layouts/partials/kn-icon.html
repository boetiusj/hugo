{{- $n := .name | lower -}}
{{- if eq $n "money" -}}
<svg class="kn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  <rect x="3" y="7" width="18" height="10" rx="2"/>
  <circle cx="12" cy="12" r="2"/>
  <path d="M7 9h.01M7 15h.01M17 9h.01M17 15h.01" stroke-linecap="round"/>
</svg>
{{- else if eq $n "clock" -}}
<svg class="kn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  <circle cx="12" cy="12" r="9"/>
  <path d="M12 7v5l4 2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{{- else if eq $n "shield" -}}
<svg class="kn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  <path d="M12 3l7 4v5c0 5-3.5 7.5-7 9-3.5-1.5-7-4-7-9V7l7-4z" stroke-linejoin="round"/>
  <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{{- else if eq $n "pin" -}}
<svg class="kn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  <path d="M12 21s-6-5.33-6-10a6 6 0 1 1 12 0c0 4.67-6 10-6 10z" stroke-linejoin="round"/>
  <circle cx="12" cy="11" r="2.5"/>
</svg>
{{- else if eq $n "calendar" -}}
<svg class="kn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  <rect x="3" y="5" width="18" height="16" rx="2"/>
  <path d="M16 3v4M8 3v4M3 9h18" stroke-linecap="round"/>
</svg>
{{- else if eq $n "star" -}}
<svg class="kn-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke-linejoin="round"/>
</svg>
{{- end -}}
