<button
  class="navbar-toggler collapsed"
  type="button"
  data-toggle="collapse"
  data-target="#navbarToggle"
  aria-controls="navbarToggle"
  aria-expanded="false"
  aria-label="Toggle navigation"
>
  {{ $image := resources.Get "images/svg/hamburger-menu.svg" }}
  <span
    ><img
      src="{{ $image.Permalink }}"
      aria-label="Toggle navigation"
      width="32"
      height="32"
      role="img"
      aria-label="hamburger-menu"
      alt="hamburger-menu"
  /></span>
</button>
