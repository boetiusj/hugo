{{ define "main" }}
<section class="section pt-4 mt-2">
	<div class="container content">
    <h1 class="pb-0">{{ .Title }}</h1>
    {{ partial "breadcrumbs/index" . }}
    {{ if .Params.image }}
      <div class="featured-image">
        {{ partial "render-image.html" (dict "Destination" .Params.image "Alt" .Title "Loading" "eager") }}
      </div>
    {{ end }}

    <main>
      {{ .Content }}
    </main>

    {{ if .Params.faqs }}
      {{ partial "faqs" . }}
    {{ end }}
  </div>
</section>
{{ end }}
