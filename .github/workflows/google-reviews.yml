name: Refresh Google Reviews

on:
  schedule:
    - cron: "17 5 * * *"         # daily 05:17 UTC
  workflow_dispatch:              # allow manual run

permissions:
  contents: write                 # needed to push the updated JSON

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      API_KEY:  ${{ secrets.GOOGLE_API_KEY }}
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }} # optional

    steps:
      - uses: actions/checkout@v4

      - name: Ensure jq is available
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch rating + count
        run: |
          curl -s "https://maps.googleapis.com/maps/api/place/details/json?place_id=${PLACE_ID}&fields=rating,user_ratings_total&key=${API_KEY}" \
          | jq -r --arg pid "$PLACE_ID" '
              { rating:(.result.rating//0)|tonumber,
                reviews:(.result.user_ratings_total//0)|tonumber,
                place_id:$pid }' > data/googleReviews.json

      - name: Commit & push only if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/googleReviews.json
          git diff --cached --quiet || git commit -m "chore: refresh Google review badge"
          git push

      - name: Trigger Netlify build (optional)
        if: ${{ env.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL"
