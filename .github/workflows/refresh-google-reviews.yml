name: Refresh Google Reviews

on:
  schedule: [{ cron: "17 5 * * *" }]   # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SITE_DIR: "."
      PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      API_KEY:  ${{ secrets.GOOGLE_API_KEY }}
      NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check secrets present (safe)
        run: |
          test -n "$GOOGLE_PLACE_ID" && echo "PLACE_ID set" || echo "::error ::GOOGLE_PLACE_ID missing"
          test -n "$GOOGLE_API_KEY"  && echo "API_KEY set"   || echo "::error ::GOOGLE_API_KEY missing"
          # Short fingerprints (safe to print)
          echo "PLACE_ID hash: $(echo -n "$GOOGLE_PLACE_ID" | sha256sum | cut -c1-10)"
          echo "API_KEY   hash: $(echo -n "$GOOGLE_API_KEY"  | sha256sum | cut -c1-10)"

      - name: Fetch rating + count (v1 with legacy fallback)
        run: |
          set -euo pipefail
          mkdir -p "$SITE_DIR/data"

          # 1) Sanitize place id (strip accidental 'places/' prefix)
          PID="${PLACE_ID#places/}"

          # 2) Try the new Places API v1
          V1_URL="https://places.googleapis.com/v1/places/${PID}"
          RESP=$(curl -s -w "\n%{http_code}" \
            -H "X-Goog-Api-Key: ${API_KEY}" \
            -H "X-Goog-FieldMask: rating,userRatingCount,displayName,name" \
            "$V1_URL")

          HTTP=$(tail -n1 <<< "$RESP")
          BODY=$(sed '$d'   <<< "$RESP")

          echo "v1 status: $HTTP"
          echo "$BODY" | jq '{name,displayName,rating,userRatingCount,error: .error}'

          RATING=""
          COUNT=""

          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            RATING=$(echo "$BODY" | jq -r '.rating // empty')
            COUNT=$(echo "$BODY"  | jq -r '.userRatingCount // empty')
          fi

          # 3) Fallback to legacy Places Details if needed
          if [ -z "$RATING" ] || [ -z "$COUNT" ]; then
            echo "Falling back to legacy Places Details…"
            LEGACY_URL="https://maps.googleapis.com/maps/api/place/details/json?place_id=${PID}&fields=rating,user_ratings_total&key=${API_KEY}"
            LRESP=$(curl -s "$LEGACY_URL")
            echo "$LRESP" | jq '{status, result: {rating, user_ratings_total}}'

            STATUS=$(echo "$LRESP" | jq -r '.status // empty')
            if [ "$STATUS" != "OK" ]; then
              echo "::error ::Legacy API error: ${STATUS:-unknown}"
              exit 1
            fi

            RATING=$(echo "$LRESP" | jq -r '.result.rating // empty')
            COUNT=$(echo "$LRESP"  | jq -r '.result.user_ratings_total // empty')
          fi

          # 4) Final check + write file
          if [ -z "$RATING" ] || [ -z "$COUNT" ]; then
            echo "::error ::Missing rating/userRatingCount in response."
            exit 1
          fi

          jq -n --arg pid "$PID" --argjson r "$RATING" --argjson c "$COUNT" \
            '{ rating: $r, reviews: $c, place_id: $pid }' \
            > "$SITE_DIR/data/googleReviews.json"

          echo "Wrote data/googleReviews.json:"
          cat "$SITE_DIR/data/googleReviews.json"

      - name: Commit & push only if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add "$SITE_DIR/data/googleReviews.json"
          if git diff --cached --quiet; then
            echo "No review badge changes to commit."
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "chore: refresh Google review badge"
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Open PR instead of pushing to working branch
        if: ${{ env.changed == 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: chore: refresh Google review badge
          branch: automation/google-review-badge
          delete-branch: true
          title: "chore: refresh Google review badge"
          body: |
            Automated update of `data/googleReviews.json` from the scheduled Google Places refresh workflow.

            This opens a PR instead of pushing directly to the site branch so local work on `mk` does not diverge from scheduled badge refreshes.

      - name: Trigger Netlify build (optional)
        if: ${{ env.NETLIFY_BUILD_HOOK_URL != '' }}
        run: curl -s -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL"
