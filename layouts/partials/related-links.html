{{- $rels := .Site.RegularPages.Related . | first 5 -}}
{{- if gt (len $rels) 0 -}}
<section class="section py-6 border-top">
  <div class="container">
    <h2 class="h5 mb-4">Related reads</h2>
    <ul class="list-unstyled m-0">
      {{- range $rels -}}
      <li class="mb-2"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
      {{- end -}}
    </ul>
  </div>
</section>
{{- end -}}
